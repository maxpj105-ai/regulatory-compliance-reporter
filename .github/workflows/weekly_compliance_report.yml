name: Weekly Compliance Report Automation

on:
  schedule:
    # 台灣時間每週五 09:30 AM (UTC+8) ➔ 對應 UTC 01:30 AM (每週五)
    - cron: '30 1 * * 5'
  workflow_dispatch: # 支援在 GitHub 網頁或手機 App 手動一鍵觸發

jobs:
  run-compliance-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Weekly Regulatory Compliance Report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python scripts/cloud_regulatory_runner.py

      - name: Upload Report Artifacts (Word & Markdown)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-compliance-report-${{ github.run_number }}
          path: |
            output/*.docx
            output/*.md
          retention-days: 90
